<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>ptC</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ptC" />
    <meta name="theme-color" content="#000000" />
  </head>
  <body>
    <main class="screen">
      <!-- Top third. Reading material, with one control in it: the way into the whole workout.
           On a 6.7 inch phone this band is out of the reach of the thumb of the hand holding it,
           which is why nothing here logs a set, and why the one control that is here is a between
           sets decision made with the other hand. -->
      <header class="context">
        <!-- Top left, and the entry to everything about today: which day it is, which lift is
             which, and the way to any of them. It replaces the day picker that used to sit lower
             in this header, which was a full row of chips that went inert the moment the first set
             was logged, since a day cannot be changed underneath sets already filed against it.
             Those chips now live inside the panel this opens, where they are still one tap from
             the start of a session and no longer spend a band of the screen for the rest of it. -->
        <button class="dayjump" type="button" id="day-jump" hidden aria-expanded="false" aria-controls="overview">
          <span class="dayjump__day" id="day-jump-label">&nbsp;</span>
          <span class="dayjump__dot" aria-hidden="true">&middot;</span>
          <span class="dayjump__pos num" id="day-jump-pos"></span>
          <svg class="dayjump__glyph" viewBox="0 0 20 20" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 8l5 5 5-5" />
          </svg>
        </button>
        <h1 class="context__exercise" id="exercise-name">&nbsp;</h1>
        <!-- The unit switch sits in the header corner, in flow, so it neither floats over the
             resume bar nor competes with the day picker for the width of a phone. On this line
             rather than beside the lift name, because a 32px name plus a 90px control wraps to
             two lines and pushes this screen into scrolling, which it must never do. -->
        <div class="context__row">
          <p class="context__set num" id="set-position">&nbsp;</p>
          <div class="unitswitch" id="unit-switch" hidden></div>
        </div>
        <p class="context__target" id="target">&nbsp;</p>
        <p class="context__last num" id="last-time">&nbsp;</p>
        <p class="pr" id="pr-chip" hidden>Personal record</p>
        <!-- The one exit from this screen, and it stays hidden while the screen is doing its job,
             because this screen must never scroll. It appears only in the dead ends: signed in
             but bound to nobody, or no client, where the controls are already gone and getting
             out is the only thing left to do. -->
        <footer class="account" id="account" hidden>
          <button class="account__out" type="button" data-signout hidden>Sign out</button>
        </footer>
      </header>

      <div class="spacer" aria-hidden="true"></div>

      <p class="notice" id="notice" hidden role="status"></p>

      <!-- The lift left behind, while it still has sets owed. The machine being busy is the
           reason to move on and the reason to come back, so the way back is a control rather than
           a memory. It says the lift by name and how much of it is left, because that is what the
           decision to go back is made on. -->
      <div class="returnbar" id="return-bar" hidden>
        <button type="button" class="button-secondary" id="return-to"></button>
      </div>

      <section class="done" id="done" hidden>
        <h2 class="done__title" id="done-title">Session logged.</h2>
        <p class="done__stat num" id="done-stat"></p>

        <!-- The one thing the sets cannot say. Optional, once, and only on a session that has
             something in it: asking how it felt after a session where nothing was logged is the
             app asking about a workout that did not happen.

             It lives inside the summary card rather than under it, because the answer is about
             the session the card is announcing. The card is also where the app's one green
             already lives, which is what the selected chip borrows its rim and glow from. -->
        <div class="feel" id="feel" hidden>
          <p class="feel__ask" id="feel-ask">How did that feel?</p>
          <div class="feel__chips" id="feel-chips" role="group" aria-labelledby="feel-ask"></div>
          <button type="button" class="button-secondary feel__more" id="feel-more">Add a note</button>
          <!-- The keyboard is the fallback and never the default, same rule the steppers follow,
               so it arrives only after a deliberate tap on the button above. -->
          <div class="feel__note" id="feel-note" hidden>
            <input
              class="feel__input"
              id="feel-text"
              type="text"
              maxlength="280"
              autocomplete="off"
              enterkeyhint="done"
              placeholder="Anything worth remembering"
              aria-label="A note about this session"
            />
          </div>
        </div>
      </section>

      <!-- The whole workout, and the way to any lift in it. A state of this screen rather than a
           layer over it: the app has no modal anywhere, and the two it did have were both removed
           for costing a focus trap, an outside click handler, an escape handler and a z-index to
           hold what a mode holds for free. The rest timer stays below it and keeps running, since
           the countdown is about the client's body and not about which lift they are looking at. -->
      <section class="worknav" id="overview" hidden aria-label="This workout">
        <header class="worknav__head">
          <h2 class="worknav__day" id="overview-title"></h2>
          <p class="worknav__pos num" id="overview-pos"></p>
        </header>
        <!-- The client picks the day. A five day rotation is not done in order, so guessing from
             the last session and offering no way to change it is wrong. Only before the first set:
             after that the session row is already filed under a day. -->
        <nav class="daypicker" id="day-picker" aria-label="Choose today's session"></nav>
        <div class="worknav__scroll" id="overview-body"></div>
        <div class="worknav__foot">
          <!-- Ending a session is once per session and irreversible only in the sense that undo
               reopens it. It sat in the thumb arc between Add set and Undo, which is the busiest
               row on the screen and has no confirmation anywhere in it by design. Here it costs
               one deliberate tap to reach and cannot be caught by a thumb aiming at Undo. -->
          <button type="button" class="button-secondary" id="end">End session</button>
        </div>
      </section>

      <!-- The remaining rest is a track along the bottom edge, never a fill behind the
           numerals. See the comment on .rest in styles.css for why. Outside .controls so that
           the overview can take the screen without taking the countdown with it. -->
      <div class="rest" id="rest" data-state="idle">
        <span class="rest__label" id="rest-label">Rest</span>
        <span class="rest__time num" id="rest-time" role="timer" aria-live="off">0:00</span>
        <span class="rest__track" aria-hidden="true"><span class="rest__fill" id="rest-fill"></span></span>
      </div>

      <!-- Bottom third, inside the thumb arc. The biggest number on the screen and the place
           the thumb goes are not the same place, so the log action sits lowest. -->
      <div class="controls" id="controls">
        <div class="secondary">
          <button type="button" class="button-secondary" id="add-set">Add set</button>
          <button type="button" class="button-secondary" id="skip">Skip lift</button>
          <button type="button" class="button-secondary" id="type-toggle">Type</button>
          <button type="button" class="button-secondary" id="undo" disabled>Undo</button>
        </div>

        <div class="stepper" id="stepper-weight">
          <button type="button" class="stepper__btn" id="weight-down" aria-label="Less weight">&minus;</button>
          <div class="stepper__readout">
            <span class="stepper__value num" id="weight-value">0</span>
            <span class="stepper__unit" id="weight-unit">kg</span>
            <input
              class="stepper__input num"
              id="weight-input"
              type="number"
              inputmode="decimal"
              step="0.5"
              min="0"
              aria-label="Weight"
              hidden
            />
          </div>
          <button type="button" class="stepper__btn" id="weight-up" aria-label="More weight">+</button>
        </div>

        <div class="stepper stepper--reps" id="stepper-reps">
          <button type="button" class="stepper__btn" id="reps-down" aria-label="Fewer reps">&minus;</button>
          <div class="stepper__readout">
            <span class="stepper__value num" id="reps-value">0</span>
            <span class="stepper__unit" id="reps-unit">reps</span>
            <input
              class="stepper__input num"
              id="reps-input"
              type="number"
              inputmode="numeric"
              step="1"
              min="1"
              aria-label="Reps"
              hidden
            />
          </div>
          <button type="button" class="stepper__btn" id="reps-up" aria-label="More reps">+</button>
        </div>

        <button type="button" class="log" id="log">
          <span id="log-label">Log set</span>
          <span class="log__sub num" id="log-sub"></span>
        </button>
      </div>
    </main>

    <!-- Bottom navigation. Reverses the CLAUDE.md rule that kept this band clear for Log set,
         which is explained in js/nav.js. The log action stays larger and keeps a gap. -->
    <nav class="tabbar" id="tabbar" aria-label="Sections" hidden></nav>


    <script type="module" src="app.js"></script>
  </body>
</html>
