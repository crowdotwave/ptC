<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>ptC</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ptC" />
    <meta name="theme-color" content="#000000" />
  </head>
  <body>
    <main class="screen">
      <!-- Top third. Nothing here is interactive: on a 6.7 inch phone held in one hand this
           band is out of the thumb's reach, so it carries reading material only. -->
      <header class="context">
        <h1 class="context__exercise" id="exercise-name">&nbsp;</h1>
        <p class="context__set num" id="set-position">&nbsp;</p>
        <!-- The client picks the day. A five day rotation is not done in order, so guessing
             from the last session and offering no way to change it is wrong.
             The unit switch is pinned to the end of this row rather than floating in the corner,
             so it can never land on the resume bar and costs no height of its own. -->
        <div class="pickerrow">
          <nav class="daypicker" id="day-picker" aria-label="Choose today's session"></nav>
          <div class="unitswitch" id="unit-switch" hidden></div>
        </div>
        <p class="context__target" id="target">&nbsp;</p>
        <p class="context__last num" id="last-time">&nbsp;</p>
        <p class="pr" id="pr-chip" hidden>Personal record</p>
        <!-- The one exit from this screen, and it stays hidden while the screen is doing its job,
             because this screen must never scroll. It appears only in the dead ends: signed in
             but bound to nobody, or no client, where the controls are already gone and getting
             out is the only thing left to do. -->
        <footer class="account" id="account" hidden>
          <button class="account__out" type="button" data-signout hidden>Sign out</button>
        </footer>
      </header>

      <div class="spacer" aria-hidden="true"></div>

      <p class="notice" id="notice" hidden role="status"></p>

      <section class="done" id="done" hidden>
        <h2 class="done__title" id="done-title">Session logged.</h2>
        <p class="done__stat num" id="done-stat"></p>
      </section>

      <!-- Bottom third, inside the thumb arc. The biggest number on the screen and the place
           the thumb goes are not the same place, so the log action sits lowest. -->
      <div class="controls" id="controls">
        <!-- The remaining rest is a track along the bottom edge, never a fill behind the
             numerals. See the comment on .rest in styles.css for why. -->
        <div class="rest" id="rest" data-state="idle">
          <span class="rest__label" id="rest-label">Rest</span>
          <span class="rest__time num" id="rest-time" role="timer" aria-live="off">0:00</span>
          <span class="rest__track" aria-hidden="true"><span class="rest__fill" id="rest-fill"></span></span>
        </div>

        <div class="secondary">
          <button type="button" class="button-secondary" id="add-set">Add set</button>
          <button type="button" class="button-secondary" id="skip">Skip lift</button>
          <button type="button" class="button-secondary" id="end">End session</button>
          <button type="button" class="button-secondary" id="type-toggle">Type</button>
          <button type="button" class="button-secondary" id="undo" disabled>Undo</button>
        </div>

        <div class="stepper" id="stepper-weight">
          <button type="button" class="stepper__btn" id="weight-down" aria-label="Less weight">&minus;</button>
          <div class="stepper__readout">
            <span class="stepper__value num" id="weight-value">0</span>
            <span class="stepper__unit" id="weight-unit">kg</span>
            <input
              class="stepper__input num"
              id="weight-input"
              type="number"
              inputmode="decimal"
              step="0.5"
              min="0"
              aria-label="Weight"
              hidden
            />
          </div>
          <button type="button" class="stepper__btn" id="weight-up" aria-label="More weight">+</button>
        </div>

        <div class="stepper stepper--reps" id="stepper-reps">
          <button type="button" class="stepper__btn" id="reps-down" aria-label="Fewer reps">&minus;</button>
          <div class="stepper__readout">
            <span class="stepper__value num" id="reps-value">0</span>
            <span class="stepper__unit" id="reps-unit">reps</span>
            <input
              class="stepper__input num"
              id="reps-input"
              type="number"
              inputmode="numeric"
              step="1"
              min="1"
              aria-label="Reps"
              hidden
            />
          </div>
          <button type="button" class="stepper__btn" id="reps-up" aria-label="More reps">+</button>
        </div>

        <button type="button" class="log" id="log">
          <span id="log-label">Log set</span>
          <span class="log__sub num" id="log-sub"></span>
        </button>
      </div>
    </main>

    <!-- Bottom navigation. Reverses the CLAUDE.md rule that kept this band clear for Log set,
         which is explained in js/nav.js. The log action stays larger and keeps a gap. -->
    <nav class="tabbar" id="tabbar" aria-label="Sections" hidden></nav>


    <script type="module" src="app.js"></script>
  </body>
</html>
