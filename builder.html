<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Programs</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="screen screen--scroll screen--wide">
      <header class="context">
        <p class="context__who">
          <span id="trainer-name">Loading</span>
          <a class="navlink" href="trainer.html">Clients</a>
          <a class="navlink" href="index.html" data-needs="client" hidden>My training</a>
          <button class="navlink" type="button" data-signout hidden>Sign out</button>
        </p>
        <h1 class="context__exercise" id="view-title">Programs</h1>
        <p class="context__target" id="view-note">&nbsp;</p>
      </header>

      <section id="list-view">
        <div class="secondary">
          <button type="button" class="button-secondary" id="new-program">New program</button>
          <!-- The label is the control. A bare file input cannot be styled and reads as a
               browser artefact next to a real button. -->
          <label class="button-secondary" for="import-file">Import a spreadsheet</label>
          <input class="visually-hidden" type="file" id="import-file" accept=".xlsx" />
        </div>
        <p class="import__error" id="import-error" hidden role="status"></p>
        <ul class="clientlist" id="program-list"></ul>
      </section>

      <!-- Review, between reading the file and writing anything. Nothing exists in the database
           while this is on screen. -->
      <section id="import-view" hidden>
        <div class="secondary">
          <button type="button" class="button-secondary" id="import-cancel">Cancel</button>
          <button type="button" class="button-secondary" id="import-create">Create this program</button>
          <span class="import__progress num" id="import-progress"></span>
        </div>
        <div id="import-draft"></div>
      </section>

      <section id="edit-view" hidden>
        <p class="backlink"><a href="#" id="back-to-list">Back to programs</a></p>

        <p class="suggest" id="live-warning" hidden></p>

        <div class="field">
          <label class="field__label" for="program-name">Program name</label>
          <input class="field__input" id="program-name" type="text" />
        </div>

        <div id="days"></div>

        <div class="secondary">
          <button type="button" class="button-secondary" id="add-day">Add day</button>
          <button type="button" class="button-secondary" id="archive">Archive program</button>
        </div>
      </section>
    </main>

    <datalist id="exercise-options"></datalist>

    <script type="module" src="builder.js"></script>
  </body>
</html>
