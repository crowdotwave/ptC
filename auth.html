<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Sign in to ptC</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="auth">
      <h1 class="auth__title">ptC</h1>
      <p class="auth__lede" id="lede">Enter the email your trainer has for you.</p>

      <form class="auth__form" id="email-form" novalidate>
        <label class="auth__label" for="email">Email</label>
        <input
          class="auth__input"
          id="email"
          type="email"
          name="email"
          inputmode="email"
          autocomplete="email"
          autocapitalize="off"
          spellcheck="false"
          required
        />
        <!-- Starts disabled. supabase-js comes from a CDN, so there is a window on a slow
             connection where this button is on screen and its submit handler is not attached
             yet. A tap in that window does nothing at all, which reads as a broken app on the
             one screen nobody can get past. -->
        <button class="auth__go" id="send" type="submit" disabled>Loading</button>
      </form>

      <!-- The typed code, behind a disclosure rather than shown alongside the link.
           It only works if the Supabase email template carries {{ .Token }}, which the default
           template does not and which needs a paid plan to change on Supabase's own sender. So
           for most deploys this input is a dead end, and offering a dead end beside a working
           link is worse than not offering it. The link is the path. This is the escape hatch
           for a phone whose mail app opens links somewhere unhelpful. -->
      <button class="auth__alt" id="show-code" type="button" hidden>Have a code instead?</button>

      <form class="auth__form" id="code-form" hidden novalidate>
        <label class="auth__label" for="code">Or paste the code from the email</label>
        <input
          class="auth__input num"
          id="code"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="8"
        />
        <button class="auth__go" id="verify" type="submit">Sign in</button>
      </form>

      <p class="auth__note" id="note" role="status"></p>
    </main>

    <script type="module" src="auth-page.js"></script>
  </body>
</html>
