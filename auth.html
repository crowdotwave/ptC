<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Sign in to ptC</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ptC" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ptC" />
  </head>
  <body>
    <main class="auth">
      <h1 class="auth__title">ptC</h1>
      <p class="auth__lede" id="lede">
        Enter the email your trainer has for you and we will send you a six digit code.
      </p>

      <form class="auth__form" id="email-form" novalidate>
        <label class="auth__label" for="email">Email</label>
        <input
          class="auth__input"
          id="email"
          type="email"
          name="email"
          inputmode="email"
          autocomplete="email"
          autocapitalize="off"
          spellcheck="false"
          required
        />
        <!-- Starts disabled. supabase-js comes from a CDN, so there is a window on a slow
             connection where this button is on screen and its submit handler is not attached
             yet. A tap in that window does nothing at all, which reads as a broken app on the
             one screen nobody can get past. -->
        <button class="auth__go" id="send" type="submit" disabled>Loading</button>
      </form>

      <!-- Revealed as soon as the page is wired, alongside the send button being enabled, and
           that is the fix rather than a detail. It used to be revealed only after an email sent
           successfully, so the one person who most needs it, somebody the sending quota has just
           cut off, could not reach it. A code lasts an hour and the quota resets in an hour, so
           somebody who has been refused is nearly always holding a live code with nowhere to type
           it.

           Starts hidden for the same reason the send button starts disabled: supabase-js comes
           from a CDN, and a control that is on screen before its handler is attached does nothing
           when tapped, which reads as a broken app on the one screen nobody can get past. -->
      <button class="auth__alt" id="show-code" type="button" hidden>I already have a code</button>

      <!-- There was a box here for pasting a sign in link, for a home screen app on iOS, which
           gets its own storage container so a link tapped in Mail signs you in to Safari and
           leaves the installed app signed out. It is gone because the emails carry no link to
           paste: see supabase/email-templates. A code fixes that container split better than the
           paste box did, since six digits typed on the phone land in whatever container is doing
           the typing, and an input asking for something no email contains is a dead end on the one
           screen nobody can get past. -->

      <form class="auth__form" id="code-form" hidden novalidate>
        <label class="auth__label" for="code">Six digit code from the email</label>
        <input
          class="auth__input num"
          id="code"
          type="text"
          inputmode="numeric"
          autocomplete="one-time-code"
          maxlength="8"
        />
        <button class="auth__go" id="verify" type="submit">Sign in</button>
      </form>

      <p class="auth__note" id="note" role="status"></p>
    </main>

    <script type="module" src="auth-page.js"></script>
  </body>
</html>
