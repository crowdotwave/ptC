<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Clients</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ptC" />
    <meta name="theme-color" content="#000000" />
  </head>
  <body>
    <main class="screen screen--scroll screen--wide">
      <header class="context">
        <div class="shell">
          <button class="shell__menu" id="menu-toggle" type="button"
                  aria-expanded="false" aria-controls="menu-panel" aria-label="Menu">
            <svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor"
                 stroke-width="1.7" stroke-linecap="round">
              <path d="M4 6h12M4 10h12M4 14h12" />
            </svg>
          </button>
          <div class="shell__panel" id="menu-panel" hidden>
            <p class="shell__who"><span id="trainer-name">Loading</span></p>
            <button class="shell__item" type="button" data-signout hidden>Sign out</button>
          </div>
        </div>
        <h1 class="context__exercise" id="view-title">Clients</h1>
        <p class="context__target" id="view-note">&nbsp;</p>
      </header>

      <section id="list-view">
        <ul class="clientlist" id="client-list"></ul>
      </section>

      <section id="detail-view" hidden>
        <p class="backlink"><a href="#" id="back-to-list">Back to clients</a></p>

        <nav class="lifts" id="lift-picker" aria-label="Choose a lift"></nav>

        <p class="suggest" id="deload-suggest" hidden></p>

        <div class="chart">
          <div class="chart__head">
            <h2 class="chart__title" id="lead-title">Estimated 1RM</h2>
            <span class="chart__value num" id="lead-value"></span>
          </div>
          <div id="lead-plot"></div>
          <p class="chart__caption" id="lead-caption"></p>
        </div>

        <div class="chart">
          <div class="chart__head">
            <h2 class="chart__title" id="second-title">Volume</h2>
            <span class="chart__value num" id="second-value"></span>
          </div>
          <div id="second-plot"></div>
          <p class="chart__caption" id="second-caption"></p>
        </div>

        <div class="chart">
          <div class="chart__head">
            <h2 class="chart__title">Reps at each load</h2>
            <span class="chart__value num" id="reps-value"></span>
          </div>
          <div id="reps-plot"></div>
          <p class="chart__caption" id="reps-caption"></p>
        </div>
      </section>
    </main>

    <!-- Bottom navigation. Reverses the CLAUDE.md rule that kept this band clear for Log set,
         which is explained in js/nav.js. The log action stays larger and keeps a gap. -->
    <nav class="tabbar" id="tabbar" aria-label="Sections" hidden></nav>


    <script type="module" src="trainer.js"></script>
  </body>
</html>
