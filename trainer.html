<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Clients</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ptC" />
    <meta name="theme-color" content="#000000" />
  </head>
  <body>
    <main class="screen screen--scroll screen--wide">
      <header class="context">
        <h1 class="context__exercise" id="view-title">Clients</h1>
        <p class="context__target" id="view-note">&nbsp;</p>
      </header>

      <section id="list-view">
        <div class="secondary">
          <button type="button" class="button-secondary" id="new-client">Add a client</button>
        </div>
        <p class="import__error" id="client-error" hidden role="status"></p>
        <ul class="clientlist" id="client-list"></ul>
      </section>

      <!-- Adding somebody, or fixing what was typed. The email is the load bearing field: it is
           the key ptc.handle_new_auth_user matches on, so a client cannot sign in until it is
           right, and until this screen existed a typo in it was unfixable from inside the app. -->
      <section id="client-form-view" hidden>
        <div class="context__row">
          <p class="backlink"><a href="#" id="client-form-back">Back to clients</a></p>
        </div>

        <p class="legend" id="client-form-legend"></p>
        <p class="import__error" id="client-form-error" hidden role="status"></p>

        <div class="field">
          <label class="field__label" for="client-name">Name</label>
          <input class="field__input" id="client-name" type="text" autocomplete="off" />
        </div>

        <div class="field">
          <label class="field__label" for="client-email">Email</label>
          <input class="field__input" id="client-email" type="email" autocomplete="off"
                 inputmode="email" spellcheck="false" />
        </div>

        <div class="secondary">
          <button type="button" class="button-secondary" id="client-save">Save</button>
        </div>

        <!-- Archive and delete, and the sentence saying which one this client can have. -->
        <div class="secondary" id="client-danger" hidden></div>
        <p class="legend" id="client-danger-note"></p>
      </section>

      <section id="detail-view" hidden>
        <!-- Same corner as the other two screens, measured from the top of this view rather than
             the page, because the header above it belongs to the client list as well. -->
        <div class="context__row">
          <p class="backlink"><a href="#" id="back-to-list">Back to clients</a></p>
          <div class="unitswitch" id="unit-switch" hidden></div>
        </div>

        <!-- Every session this client logged, including what they said about each one. That list
             lives on the progress screen, which already renders somebody else's training when a
             trainer opens it with ?client=, so this is a link rather than a second copy of it.
             Without it the notes were reachable only by typing a URL. -->
        <p class="backlink"><a href="#" id="see-sessions">See every session</a></p>

        <nav class="lifts" id="lift-picker" aria-label="Choose a lift"></nav>

        <p class="suggest" id="deload-suggest" hidden></p>

        <div class="chart">
          <div class="chart__head">
            <h2 class="chart__title" id="lead-title">Estimated 1RM</h2>
            <span class="chart__value num" id="lead-value"></span>
          </div>
          <div id="lead-plot"></div>
          <p class="chart__caption" id="lead-caption"></p>
        </div>

        <div class="chart">
          <div class="chart__head">
            <h2 class="chart__title" id="second-title">Volume</h2>
            <span class="chart__value num" id="second-value"></span>
          </div>
          <div id="second-plot"></div>
          <p class="chart__caption" id="second-caption"></p>
        </div>

        <div class="chart">
          <div class="chart__head">
            <h2 class="chart__title">Reps at each load</h2>
            <span class="chart__value num" id="reps-value"></span>
          </div>
          <div id="reps-plot"></div>
          <p class="chart__caption" id="reps-caption"></p>
        </div>
      </section>

      <!-- Who you are signed in as, and the way out. Quietest type on the page. -->
      <footer class="account">
        <span class="account__who" id="trainer-name"></span>
        <button class="account__out" type="button" data-signout hidden>Sign out</button>
      </footer>
    </main>

    <!-- Bottom navigation. Reverses the CLAUDE.md rule that kept this band clear for Log set,
         which is explained in js/nav.js. The log action stays larger and keeps a gap. -->
    <nav class="tabbar" id="tabbar" aria-label="Sections" hidden></nav>


    <script type="module" src="trainer.js"></script>
  </body>
</html>
