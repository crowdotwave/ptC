<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Progress</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="ptC" />
    <meta name="theme-color" content="#000000" />
  </head>
  <body>
    <main class="screen screen--scroll">
      <!-- Sticky at the top, never the bottom, so it cannot enter the thumb arc. Only present
           while a session is actually open. -->
      <a class="resume" id="resume" href="index.html" hidden></a>

      <!-- Whose data this is. Shown only when a trainer is reading somebody else's progress,
           because a client does not need their own name on their own screen.
           It sits above the consistency card rather than inside the header below it: a trainer
           three clients deep needs to know whose numbers these are without scrolling, and the
           card is most of a phone screen tall. -->
      <p class="context__who" id="client-name" hidden></p>

      <!-- The centrepiece, and the only client wide thing on this screen. Everything below it is
           scoped to one lift, which is why it holds the h1 and the lift name below is an h2.
           Rendered once, outside render(), because this screen redraws on every unit toggle and
           on every resize and neither should throw away which month you had scrolled to. -->
      <section class="consistency" id="consistency" aria-labelledby="consistency-title">
        <!-- The arrows sit beside the title, and the all time count sits under it. They used to be
             a right aligned row of their own above the scroller, which spent a whole band of a
             phone screen on two buttons and left the title's line half empty. Putting all three on
             one line does not fit: "Consistency" is 195px at the mid set tier and the count plus
             the arrows is another 158, against 324 of card on a 390px phone. -->
        <div class="consistency__head">
          <div class="consistency__heading">
            <h1 class="consistency__title" id="consistency-title">Consistency</h1>
            <span class="consistency__total num" id="consistency-total"></span>
          </div>
          <div class="cal__nav" id="cal-nav"></div>
        </div>
        <div id="consistency-body"></div>
      </section>

      <header class="context">
        <h2 class="context__exercise" id="exercise-name">&nbsp;</h2>
        <div class="context__row">
          <p class="context__last num" id="headline">&nbsp;</p>
          <div class="unitswitch" id="unit-switch" hidden></div>
        </div>
      </header>

      <nav class="lifts" id="lift-picker" aria-label="Choose a lift"></nav>

      <section class="chart" id="lead-chart" aria-labelledby="lead-title">
        <div class="chart__head">
          <h3 class="chart__title" id="lead-title">Estimated 1RM</h3>
          <span class="chart__value num" id="lead-value"></span>
        </div>
        <div id="lead-plot"></div>
        <p class="chart__caption" id="lead-caption"></p>
      </section>

      <section class="chart" id="reps-chart" aria-labelledby="reps-title">
        <div class="chart__head">
          <h3 class="chart__title" id="reps-title">Reps at each load</h3>
          <span class="chart__value num" id="reps-value"></span>
        </div>
        <div id="reps-plot"></div>
        <p class="chart__caption" id="reps-caption"></p>
      </section>

      <!-- Last, on purpose. It is the slowest moving number here and the one that spans blocks,
           so it answers "am I stronger than I was" rather than "how did today go". Putting it
           first meant a client opened their progress on the line least likely to have moved. -->
      <section class="chart" id="second-chart" aria-labelledby="second-title">
        <div class="chart__head">
          <h3 class="chart__title" id="second-title">Estimated 1RM</h3>
          <span class="chart__value num" id="second-value"></span>
        </div>
        <div id="second-plot"></div>
        <p class="chart__caption" id="second-caption"></p>
      </section>

      <!-- Below the charts, because it is the maintenance view rather than the point of this
           screen. Somebody comes here to fix a mis-tap, and that is worth reaching by scrolling
           past the work rather than by scrolling past it to reach the work. -->
      <section class="history" id="history" aria-labelledby="history-title" hidden>
        <div class="history__head">
          <h3 class="history__title" id="history-title">Session history</h3>
        </div>
        <div id="history-body"></div>
        <p class="history__said" id="history-said" role="status" aria-live="polite"></p>
      </section>

      <!-- Who you are signed in as, and the way out. Last thing on the page, in the quietest
           type on it, because signing out is something you do once when a bug happens. -->
      <footer class="account">
        <span class="account__who" id="account-name"></span>
        <button class="account__out" type="button" data-signout hidden>Sign out</button>
      </footer>
    </main>

    <!-- Bottom navigation. Reverses the CLAUDE.md rule that kept this band clear for Log set,
         which is explained in js/nav.js. The log action stays larger and keeps a gap. -->
    <nav class="tabbar" id="tabbar" aria-label="Sections" hidden></nav>


    <script type="module" src="progress.js"></script>
  </body>
</html>
